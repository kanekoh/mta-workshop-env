apiVersion: maas.opendatahub.io/v1alpha1
kind: Tenant
metadata:
  name: default-tenant
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  externalOIDC:
    clientId: maas-gateway
    # PostSync Hook Job (cluster-config) が実際の Keycloak Route FQDN に自動パッチする
    issuerUrl: https://keycloak-keycloak.placeholder.cluster.local/realms/maas-test
    ttl: 300
  gatewayRef:
    name: maas-default-gateway
    namespace: openshift-ingress
  telemetry:
    enabled: true
    metrics:
      captureOrganization: true
      captureUser: true
      captureGroup: false
      captureModelUsage: true
