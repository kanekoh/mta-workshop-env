apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupsync-mock
  namespace: groupsync-mock
  labels:
    app: groupsync-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: groupsync-mock
  template:
    metadata:
      labels:
        app: groupsync-mock
    spec:
      containers:
        - name: nginx
          image: registry.access.redhat.com/ubi9/nginx-124:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: groupsync-data
