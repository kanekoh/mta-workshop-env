apiVersion: v1
kind: ConfigMap
metadata:
  name: groupsync-data
  namespace: groupsync-mock
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      default_type application/json;
      server {
        listen 8080;

        location /group_conditions/GRP-PREMIUM {
          return 200 '{"data":{"items":{"members":[{"email_address":"premium-user1@test.example","r_kid_email_address":"premium-user1.kid@test.example"},{"email_address":"premium-user2@test.example","r_kid_email_address":null}]}}}';
        }

        location /group_conditions/GRP-BASIC {
          return 200 '{"data":{"items":{"members":[{"email_address":"basic-user1@test.example","r_kid_email_address":"basic-user1.kid@test.example"},{"email_address":"basic-user2@test.example","r_kid_email_address":null}]}}}';
        }

        location /healthz {
          return 200 '{"status": "ok"}';
        }

        location / {
          return 404 '{"error": "not_found", "message": "Group not found"}';
        }
      }
    }
