apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: litellm
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-litellm-demo-key-change-me"
  DATABASE_URL: "postgresql://litellm:litellm-demo-password-change-me@litellm-postgresql:5432/litellm"
  # 外部 LLM プロバイダーの API キーを追加する場合:
  # OPENAI_API_KEY: "sk-..."
  # ANTHROPIC_API_KEY: "sk-ant-..."
