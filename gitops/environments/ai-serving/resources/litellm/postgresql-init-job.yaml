apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-create-maas-db
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: postgresql-init
      restartPolicy: Never
      containers:
        - name: create-db
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL pod to be ready..."
              oc wait --for=condition=ready pod -l app=litellm-postgresql -n litellm --timeout=120s

              PG_POD=$(oc get pod -l app=litellm-postgresql -n litellm -o jsonpath='{.items[0].metadata.name}')
              echo "PostgreSQL pod: ${PG_POD}"

              echo "Checking if database 'maas' exists..."
              EXISTS=$(oc exec ${PG_POD} -n litellm -- psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='maas'")
              if [ "${EXISTS}" = "1" ]; then
                echo "Database 'maas' already exists. Skipping."
              else
                echo "Creating database 'maas'..."
                oc exec ${PG_POD} -n litellm -- psql -U postgres -c "CREATE DATABASE maas OWNER litellm;"
                echo "Database 'maas' created successfully."
              fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
