apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-create-maas-db
  namespace: litellm
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-db
          image: registry.redhat.io/rhel9/postgresql-16:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              until pg_isready -h litellm-postgresql -p 5432 -U litellm; do
                echo "Waiting for PostgreSQL..."
                sleep 3
              done

              echo "Checking if database 'maas' exists..."
              if psql -h litellm-postgresql -U litellm -d litellm -tAc "SELECT 1 FROM pg_database WHERE datname='maas'" | grep -q 1; then
                echo "Database 'maas' already exists. Skipping."
              else
                echo "Creating database 'maas'..."
                psql -h litellm-postgresql -U litellm -d litellm -c "CREATE DATABASE maas OWNER litellm;"
                echo "Database 'maas' created."
              fi
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-postgresql
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
