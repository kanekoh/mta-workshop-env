apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-init
  namespace: litellm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-init
  namespace: litellm
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-init
  namespace: litellm
subjects:
  - kind: ServiceAccount
    name: postgresql-init
    namespace: litellm
roleRef:
  kind: Role
  name: postgresql-init
  apiGroup: rbac.authorization.k8s.io
