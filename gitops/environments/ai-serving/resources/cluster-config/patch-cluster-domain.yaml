apiVersion: batch/v1
kind: Job
metadata:
  name: patch-cluster-domain
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: cluster-config-patcher
      restartPolicy: Never
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              DOMAIN=$(oc get ingress.config cluster -o jsonpath='{.spec.domain}')
              echo "Detected apps domain: ${DOMAIN}"

              KC_ROUTE=$(oc get route keycloak -n keycloak -o jsonpath='{.spec.host}' 2>/dev/null || echo "keycloak-keycloak.${DOMAIN}")
              ISSUER_URL="https://${KC_ROUTE}/realms/maas-test"
              echo "Keycloak issuer URL: ${ISSUER_URL}"

              if oc get tenant default-tenant -n models-as-a-service &>/dev/null; then
                echo "Patching Tenant default-tenant ..."
                oc patch tenant default-tenant -n models-as-a-service --type merge -p \
                  "{\"spec\":{\"externalOIDC\":{\"issuerUrl\":\"${ISSUER_URL}\"}}}"
              else
                echo "SKIP: Tenant default-tenant not found (not yet created)"
              fi

              if oc get certificate maas-default-gateway-tls -n openshift-ingress &>/dev/null; then
                echo "Patching Certificate maas-default-gateway-tls ..."
                oc patch certificate maas-default-gateway-tls -n openshift-ingress --type merge -p \
                  "{\"spec\":{\"dnsNames\":[\"*.${DOMAIN}\"]}}"
              else
                echo "SKIP: Certificate maas-default-gateway-tls not found (not yet created)"
              fi

              # --- Authorino: service-serving CA trust ---
              if oc get authorino authorino -n kuadrant-system &>/dev/null; then
                CURRENT_VOLUMES=$(oc get authorino authorino -n kuadrant-system -o jsonpath='{.spec.volumes.items}' 2>/dev/null)
                if echo "$CURRENT_VOLUMES" | grep -q "openshift-service-ca"; then
                  echo "SKIP: Authorino CR already has service-ca volume"
                else
                  echo "Patching Authorino CR: adding service-ca volume ..."
                  oc patch authorino authorino -n kuadrant-system --type merge -p \
                    '{"spec":{"volumes":{"items":[{"name":"service-ca","mountPath":"/etc/ssl/certs/openshift","configMaps":["openshift-service-ca"],"items":[{"key":"service-ca.crt","path":"service-ca.crt"}]}]}}}'
                fi
              else
                echo "SKIP: Authorino CR not found (RHCL not yet ready)"
              fi

              if oc get deploy authorino -n kuadrant-system &>/dev/null; then
                CURRENT_ENV=$(oc get deploy authorino -n kuadrant-system -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="SSL_CERT_DIR")].value}' 2>/dev/null)
                if [ -n "$CURRENT_ENV" ]; then
                  echo "SKIP: Authorino Deployment already has SSL_CERT_DIR=${CURRENT_ENV}"
                else
                  echo "Setting SSL_CERT_DIR on Authorino Deployment ..."
                  oc set env deploy/authorino -n kuadrant-system SSL_CERT_DIR=/etc/ssl/certs:/etc/ssl/certs/openshift
                fi
              else
                echo "SKIP: Authorino Deployment not found"
              fi

              # --- maas-ui: MAAS_API_URL workaround (KCS 7143361) ---
              if oc get deploy rhods-dashboard -n redhat-ods-applications &>/dev/null; then
                GW_ADDR=$(oc get gateway maas-default-gateway -n openshift-ingress \
                  -o jsonpath='{.status.addresses[0].value}' 2>/dev/null || true)
                if [ -n "$GW_ADDR" ]; then
                  MAAS_API_URL="https://${GW_ADDR}/maas-api"
                  CURRENT_URL=$(oc get deploy rhods-dashboard -n redhat-ods-applications \
                    -o jsonpath='{.spec.template.spec.containers[?(@.name=="maas-ui")].env[?(@.name=="MAAS_API_URL")].value}' 2>/dev/null)
                  if [ "$CURRENT_URL" = "$MAAS_API_URL" ]; then
                    echo "SKIP: maas-ui MAAS_API_URL already set to ${MAAS_API_URL}"
                  else
                    echo "Setting maas-ui MAAS_API_URL=${MAAS_API_URL} ..."
                    oc set env deploy/rhods-dashboard -c maas-ui \
                      MAAS_API_URL="${MAAS_API_URL}" \
                      -n redhat-ods-applications
                  fi
                else
                  echo "SKIP: Gateway address not yet available"
                fi
              else
                echo "SKIP: rhods-dashboard not found"
              fi

              echo "Done. Cluster domain configuration applied."
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
