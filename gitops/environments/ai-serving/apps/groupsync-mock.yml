apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: groupsync-mock
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kanekoh/mta-workshop-env.git
    targetRevision: main
    path: gitops/environments/ai-serving/resources/groupsync-mock
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: groupsync-mock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
