# COO を openshift-cluster-observability-operator にインストールすれば
# 自動生成 NetworkPolicy が正しく機能するためこの workaround は不要。
# openshift-operators にインストールした場合のフォールバックとして残す。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: perses-operator-access-fix
  namespace: redhat-ods-monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: perses-operator
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-operators
      podSelector:
        matchLabels:
          app.kubernetes.io/name: perses-operator
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-cluster-observability-operator
      podSelector:
        matchLabels:
          app.kubernetes.io/name: perses-operator
    ports:
    - port: 8080
      protocol: TCP
